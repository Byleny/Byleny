<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193 86" width="193" height="86" role="img" aria-label="btn-correo"><style>@font-face{font-family:'SG7';src:url(data:font/woff;base64,) format('woff')}
.a{transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
