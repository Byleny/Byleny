<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="h-trayectoria"><style>@font-face{font-family:'JB7';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SG7';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'CV';src:url(data:font/woff;base64,) format('woff')}
.a{transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes fade{from{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(6px) rotate(1deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes hl{from{transform:scaleX(0)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g class="a" style="animation:fade 0.5s cubic-bezier(.2,.8,.2,1) 0s backwards"><rect x="7" y="17" width="152.8" height="27.3" rx="13.65" fill="#121212"/><rect x="4" y="14" width="152.8" height="27.3" rx="13.65" fill="#4640DE" stroke="#121212" stroke-width="2" /><text x="80.4" y="32.3" font-family="JB7" font-size="13" fill="#FAFAF9" text-anchor="middle" >02 / TRAYECTORIA</text></g><g class="a" style="animation:up 0.7s cubic-bezier(.2,.8,.2,1) 0.1s backwards"><text x="2.0" y="104.0" font-family="SG7" font-size="52" fill="#121212" text-anchor="start" letter-spacing="-1.5" >De dónde vengo</text></g><path d="M4 118 q 96 -10 193 0 t 193 0" fill="none" stroke="#F2C230" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" style="animation:draw 0.9s cubic-bezier(.2,.8,.2,1) 0.5s backwards"/><g class="a" style="animation:pop 0.6s cubic-bezier(.2,.8,.2,1) 0.8s backwards"><g transform="rotate(-5 445.796 90)"><text x="445.8" y="98.0" font-family="CV" font-size="32" fill="#4640DE" text-anchor="start" >¡y lo que viene!</text></g></g></svg>