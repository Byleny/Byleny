<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 190" width="610" height="190" role="img" aria-label="mini-panini"><style>@font-face{font-family:'JB7';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SG7';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SG5';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'JB5';src:url(data:font/woff;base64,) format('woff')}
.a{transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes fade{from{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(6px) rotate(1deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes hl{from{transform:scaleX(0)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
